<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>央企基本信息知识图谱</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">◇</span><h1>央企基本信息知识图谱</h1><span class="brand-sub">CENTRAL SOE INTELLIGENCE</span></div>
      <div class="statistics" aria-label="数据统计">
        <div class="stat"><span>央企总数</span><strong id="statGroups">--</strong></div>
        <div class="stat"><span>二级单位</span><strong id="statSecondary">--</strong></div>
        <div class="stat"><span>三级单位</span><strong id="statTertiary">--</strong></div>
        <div class="stat"><span>行业类别</span><strong id="statIndustries">--</strong></div>
        <div class="stat"><span>总部所在地</span><strong id="statRegions">--</strong></div>
        <div class="stat"><span>上市平台</span><strong id="statListings">--</strong></div>
        <div class="stat"><span>大数据平台已记录</span><strong id="statPlatforms">--</strong></div>
      </div>
    </header>

    <aside class="side-panel left-panel" id="leftPanel">
      <button class="panel-collapse" data-collapse="left" title="折叠左侧栏">‹</button>
      <div class="view-switch" role="tablist"><button class="tab active" data-view="graph">图谱视图</button><button class="tab" data-view="table">表格视图</button></div>
      <section class="control-section">
        <h2>企业搜索</h2>
        <label class="search-box"><span>⌕</span><input id="searchInput" autocomplete="off" placeholder="搜索集团、二级、三级或上市公司"></label>
        <div class="search-suggestions" id="searchSuggestions"></div>
      </section>
      <section class="control-section">
        <h2>属性查询</h2>
        <div class="attribute-query"><select id="attributeSelect"><option value="all">-- 选择查询属性 --</option><option value="industry">行业</option><option value="region">地区</option><option value="level">企业层级</option><option value="assets">资产规模</option><option value="revenue">营收规模</option><option value="employees">员工人数</option><option value="creditRating">信用评级</option><option value="listingPlatform">上市情况</option><option value="dataPlatform">大数据平台</option><option value="dataPlatformStatus">平台证据状态</option><option value="sapStatus">SAP使用情况</option><option value="sapProducts">HANA使用情况</option></select></div>
      </section>
      <section class="control-section">
        <h2>企业层级筛选</h2><div class="chips" id="levelChips"></div>
      </section>
      <section class="control-section">
        <h2>大行业筛选</h2><div class="chips" id="industryChips"></div>
      </section>
      <section class="control-section">
        <h2>总部所在地</h2><div class="chips emptyable" id="regionChips"></div>
      </section>
      <section class="control-section">
        <h2>平台证据状态</h2><div class="chips" id="platformStatusChips"></div>
      </section>
      <section class="control-section results-section">
        <h2>查询结果</h2><p class="result-count" id="resultCount">共 0 家企业</p><div class="result-list" id="resultList"></div>
      </section>
    </aside>

    <main class="workspace">
      <section class="graph-view" id="graphView">
        <div class="graph-toolbar"><div class="legend"><span class="legend-title">图谱说明</span><button data-legend="group"><i class="dot group"></i>央企集团</button><button data-legend="secondary"><i class="dot secondary"></i>二级单位</button><button data-legend="tertiary"><i class="dot tertiary"></i>三级单位</button><button data-legend="industry"><i class="dot industry"></i>大行业</button><button data-legend="region"><i class="dot region"></i>总部所在地</button><button data-legend="listing"><i class="dot listing"></i>上市公司</button><button data-legend="platform"><i class="dot platform sap"></i>大数据平台</button><button data-legend="sap"><i class="dot sap"></i>SAP/HANA</button></div>
          <div class="canvas-actions"><button id="expandAll" title="展开全部">⊞</button><button id="collapseAll" title="收起全部">⊟</button><button id="fitView" title="适应屏幕">⛶</button><button id="resetView" title="恢复视图">↻</button></div>
        </div>
        <canvas id="graphCanvas" aria-label="央企知识图谱交互画布"></canvas><div class="graph-tooltip" id="graphTooltip"></div>
        <div class="graph-hint">滚轮缩放 · 拖拽平移 · 单击查看详情 · 双击企业展开下一级</div>
      </section>
      <section class="table-view hidden" id="tableView"><div class="table-wrap"><table id="enterpriseTable"><thead></thead><tbody></tbody></table></div><div class="pagination" id="pagination"></div></section>
    </main>

    <aside class="side-panel detail-panel" id="detailPanel">
      <button class="panel-collapse" data-collapse="right" title="折叠详情栏">›</button>
      <div id="detailContent" class="detail-content"><div class="detail-empty"><span>◎</span><h2>企业详情</h2><p>选择图谱节点或查询结果以查看企业信息。</p></div></div>
    </aside>
  </div>
  <script src="data/graph-data.js"></script>
  <script src="js/ui-state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
